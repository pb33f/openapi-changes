asyncapi: 3.0.0
info:
  title: Synthetic order events
  version: 2.0.0
servers:
  production:
    host: events.example.test:9092
    protocol: kafka
channels:
  orders:
    address: orders.v2
    messages:
      created:
        contentType: application/json
        payload:
          $ref: '#/components/schemas/Order'
operations:
  receiveOrder:
    action: send
    channel:
      $ref: '#/channels/orders'
components:
  schemas:
    Order:
      type: object
      properties:
        id:
          type: integer
